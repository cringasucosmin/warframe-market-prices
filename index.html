<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warframe Market · Seturi Prime</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0e14;
    --panel: #111721;
    --panel2: #0d131c;
    --line: #1c2430;
    --line2: #263041;
    --text: #e6edf3;
    --muted: #7d8896;
    --accent: #4dd0e1;      /* platina */
    --accent-dim: #1f3b40;
    --green: #3fb950;
    --amber: #d9a441;
    --gold: #e3b341;
    --violet: #a78bfa;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }

  header { padding: 20px 26px 16px; background: linear-gradient(180deg, #0d131c, #0a0e14); border-bottom: 1px solid var(--line); }
  .top { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 650; letter-spacing: .2px; }
  .brand small { color: var(--muted); font-weight: 400; font-size: 13px; }
  .spacer { flex: 1; }

  .search { position: relative; flex: 1; max-width: 340px; }
  .search input { width: 100%; padding: 9px 12px 9px 34px; border-radius: 9px; border: 1px solid var(--line2); background: var(--panel2); color: var(--text); font: inherit; }
  .search input:focus { outline: none; border-color: var(--accent); }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); opacity: .5; }

  .btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px; border-radius: 9px; border: 1px solid var(--accent); background: var(--accent); color: #04222a; font: inherit; font-weight: 600; cursor: pointer; }
  .btn:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .5; cursor: default; filter: none; }
  .toggle { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; cursor: pointer; user-select: none; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 6px 13px; border-radius: 20px; border: 1px solid var(--line2); background: var(--panel2); color: var(--muted); font-size: 13px; cursor: pointer; transition: .12s; }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  .chip.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .chip b { color: inherit; opacity: .7; font-weight: 500; margin-left: 4px; }
  .chip.vault.active { background: #241b3d; border-color: var(--violet); color: var(--violet); }
  .chipsep { width: 1px; align-self: stretch; background: var(--line2); margin: 2px 4px; }
  .vlt { display: inline-block; padding: 2px 10px; border-radius: 20px; background: #241b3d; border: 1px solid #3d3260; color: var(--violet); font-size: 11px; font-weight: 600; }
  .unv { display: inline-block; padding: 2px 10px; border-radius: 20px; background: #12271a; border: 1px solid #1e4028; color: var(--green); font-size: 11px; font-weight: 600; }

  .barwrap { display: flex; align-items: center; gap: 10px; }
  .bar { height: 6px; background: #1a2130; border-radius: 3px; overflow: hidden; width: 150px; display: none; }
  .bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  #prog { color: var(--muted); font-size: 12px; }

  main { padding: 0 26px 80px; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; margin-top: 10px; }
  thead th { position: sticky; top: 0; z-index: 3; background: #0c121a; color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line2); cursor: pointer; user-select: none; white-space: nowrap; }
  thead th.sorted { color: var(--accent); }
  thead th.sorted::after { content: attr(data-dir); margin-left: 5px; }
  th.r, td.r { text-align: right; }
  th.c, td.c { text-align: center; }

  tbody tr.set td { padding: 9px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  tbody tr.set { cursor: pointer; }
  tbody tr.set:hover td { background: #0f1620; }
  tbody tr.owned td { opacity: .38; }
  tbody tr.owned:hover td { opacity: .6; }

  .setname { display: flex; align-items: center; gap: 12px; }
  .thumb { width: 38px; height: 38px; border-radius: 8px; background: #0c121a center/70% no-repeat; border: 1px solid var(--line2); flex: none; }
  .setname .nm { font-weight: 550; }
  .setname a { color: var(--text); text-decoration: none; }
  .setname a:hover { color: var(--accent); }
  .arrow { color: var(--muted); font-size: 11px; width: 12px; display: inline-block; transition: transform .15s; }
  tr.open .arrow { transform: rotate(90deg); color: var(--accent); }

  .typ { display: inline-block; padding: 2px 10px; border-radius: 20px; background: #17202c; border: 1px solid var(--line2); color: var(--muted); font-size: 12px; }
  .price { display: inline-flex; align-items: center; gap: 6px; justify-content: flex-end; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 16px; color: var(--accent); }
  .price.na { color: var(--muted); font-weight: 400; font-size: 14px; }
  img.plat { height: 15px; width: auto; vertical-align: -2px; }
  .parts { display: inline-flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 400; font-size: 13px; }
  .pill { padding: 1px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .pill.good { background: #12271a; color: var(--green); border: 1px solid #1e4028; }
  .pill.warn { background: #2b2214; color: var(--amber); border: 1px solid #4a3a1c; }
  .pill.neutral { background: #17202c; color: var(--muted); border: 1px solid var(--line2); }
  .duc { display: inline-flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; color: var(--gold); font-weight: 550; }
  .duc .dpp { color: var(--muted); font-weight: 400; font-size: 11px; }
  .price .onlineflag { color: var(--amber); font-size: 11px; font-weight: 500; }
  .sel { color: var(--muted); font-variant-numeric: tabular-nums; }
  .upd { color: var(--muted); font-size: 12px; }
  .ck { width: 17px; height: 17px; accent-color: var(--green); cursor: pointer; }

  tr.detail td { background: var(--panel2); padding: 0; border-bottom: 1px solid var(--line2); }
  .detbox { padding: 12px 20px 16px 64px; }
  .comp { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 24px; max-width: 560px; }
  .comp .h { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid var(--line); padding-bottom: 4px; margin-bottom: 2px; }
  .comp a { color: var(--text); text-decoration: none; } .comp a:hover { color: var(--accent); }
  .comp .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 550; }
  .comp .num.na { color: var(--muted); font-weight: 400; }
  .cmp { margin-top: 12px; font-size: 13px; padding: 8px 12px; border-radius: 8px; background: #0c121a; display: inline-block; }
  .cmp.good { color: var(--green); } .cmp.warn { color: var(--amber); } .cmp.neutral { color: var(--muted); }
</style>
</head>

  <div class="top">

      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
      <input id="q" placeholder="Cauta set...">

    <button class="btn" id="refresh"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg> Refresh</button>
  </div>
  <div class="chips" id="chips"></div>
</header>
<main>
  <table id="tbl">
    <thead><tr>

      <th class="r" data-k="updated" style="width:100px">Actualizat</th>
    </tr></thead>
    <tbody></tbody>
  </table>
</main>

const DUCAT = '<svg width="13" height="13" viewBox="0 0 24 24" style="vertical-align:-2px"><circle cx="12" cy="12" r="10" fill="url(#ducCoin)" stroke="#6b4e15" stroke-width="1.2"/><circle cx="12" cy="12" r="5.5" fill="none" stroke="#8a6620" stroke-width="1.4"/></svg>';
let DATA = [];
let sortK = "price", sortDir = 1, typeFilter = "", vaultFilter = "";
const owned = JSON.parse(localStorage.getItem("wfm_owned") || "{}");
const compCache = {};
const $ = s => document.querySelector(s);

function saveOwned() { localStorage.setItem("wfm_owned", JSON.stringify(owned)); }
function ago(ts) {
  if (!ts) return "-";
  const s = Date.now()/1000 - ts;
  if (s < 90) return "acum"; if (s < 3600) return Math.round(s/60)+"m";
  if (s < 86400) return Math.round(s/3600)+"h"; return Math.round(s/86400)+"z";
}
function priceHtml(r) {
  if (r.price == null) return `<span class="price na">-</span>`;
  const flag = r.kind === "online" ? ` <span class="onlineflag" title="nimeni in joc acum">online</span>` : "";
  return `<span class="price">${PLAT} ${r.price}${flag}</span>`;
}
function partsHtml(r) {
  if (r.parts_sum == null) return `<span class="price na">-</span>`;
  let pill = "";
  if (r.price != null) {
    const diff = r.parts_sum - r.price;  // fata de pretul setului
    if (diff > 0) pill = `<span class="pill neutral" title="pe bucati e cu ${diff}p mai scump decat setul - ia setul">+${diff}</span>`;
    else if (diff < 0) pill = `<span class="pill good" title="pe bucati e cu ${-diff}p mai ieftin decat setul - merita luat pe piese">&minus;${-diff}</span>`;
    else pill = `<span class="pill neutral" title="acelasi pret intreg sau pe bucati">=</span>`;
  }
  return `<span class="parts">${r.parts_sum} ${pill}</span>`;
}
function statusHtml(r) {
  if (r.vaulted === true) return `<span class="vlt" title="nu mai pica din relicve acum - supply-ul scade, pretul urca in timp">Vaulted</span>`;
  if (r.vaulted === false) return `<span class="unv" title="pica din relicve acum - preturile-s la minim">Unvaulted</span>`;
  return `<span class="price na">-</span>`;
}
function ducatsHtml(r) {
  if (!r.ducats) return `<span class="price na">-</span>`;
  const dpp = r.price ? ` <span class="dpp" title="ducati per platina">${(r.ducats / r.price).toFixed(1)}/p</span>` : "";
  return `<span class="duc">${DUCAT} ${r.ducats}${dpp}</span>`;
}

function renderChips() {
  // numerele reflecta ce se vede: cu "ascunde ce am" bifat, detinutele nu se numara
  const base = $("#hideOwned").checked ? DATA.filter(r => !owned[r.slug]) : DATA;
  const counts = {}; base.forEach(r => counts[r.type] = (counts[r.type]||0)+1);
  const order = ["Warframe","Primary","Secondary","Melee","Companion","Archwing","Archgun","Altele"];
  const types = order.filter(t => counts[t]);
  const nv = base.filter(r => r.vaulted === true).length;
  const nu = base.filter(r => r.vaulted === false).length;
  const el = $("#chips");
  el.innerHTML =
    `<div class="chip ${typeFilter===''&&vaultFilter===''?'active':''}" data-t="">Toate <b>${base.length}</b></div>` +
    types.map(t => `<div class="chip ${typeFilter===t?'active':''}" data-t="${t}">${t} <b>${counts[t]}</b></div>`).join("") +
    (nv + nu ? `<div class="chipsep"></div>` +
      `<div class="chip vault ${vaultFilter==='v'?'active':''}" data-v="v">Vaulted <b>${nv}</b></div>` +
      `<div class="chip vault ${vaultFilter==='u'?'active':''}" data-v="u">Unvaulted <b>${nu}</b></div>` : "");
}

function render() {
  const q = $("#q").value.toLowerCase().trim();
  const hideOwned = $("#hideOwned").checked;
  let rows = DATA.filter(r => {
    if (typeFilter && r.type !== typeFilter) return false;
    if (vaultFilter === "v" && r.vaulted !== true) return false;
    if (vaultFilter === "u" && r.vaulted !== false) return false;
    if (q && !r.name.toLowerCase().includes(q)) return false;
    if (hideOwned && owned[r.slug]) return false;
    return true;
  });
  rows.sort((a, b) => {
    let x, y;
    if (sortK === "owned") { x = owned[a.slug]?1:0; y = owned[b.slug]?1:0; }
    else if (["price","sellers","updated","parts_sum","ducats","vaulted"].includes(sortK)) {
      x = a[sortK]; y = b[sortK];
      if (x == null) x = sortDir === 1 ? Infinity : -Infinity;
      if (y == null) y = sortDir === 1 ? Infinity : -Infinity;
    } else { x = (a[sortK]||"").toString().toLowerCase(); y = (b[sortK]||"").toString().toLowerCase(); }
    return x < y ? -sortDir : x > y ? sortDir : 0;
  });

  const tb = $("#tbl tbody");
  tb.innerHTML = "";
  const frag = document.createDocumentFragment();
  for (const r of rows) {
    const tr = document.createElement("tr");
    tr.className = "set" + (owned[r.slug] ? " owned" : "");
    tr.dataset.slug = r.slug;
    const th = r.thumb ? `background-image:url('${r.thumb}')` : "";
    tr.innerHTML =
      `<td class="c"><input type="checkbox" class="ck" ${owned[r.slug]?"checked":""} data-s="${r.slug}"></td>` +
      `<td><div class="setname"><span class="arrow">&#9656;</span><span class="thumb" style="${th}"></span>` +
        `<span class="nm"><a href="https://warframe.market/items/${r.slug}" target="_blank">${r.name.replace(/ Set$/,'')}</a></span></div></td>` +
      `<td class="r">${priceHtml(r)}</td>` +
      `<td class="r">${partsHtml(r)}</td>` +
      `<td class="r">${ducatsHtml(r)}</td>` +
      `<td>${statusHtml(r)}</td>` +
      `<td><span class="typ">${r.type}</span></td>` +
      `<td class="r sel">${r.sellers ?? 0}</td>` +
      `<td class="r upd">${ago(r.updated)}</td>`;
    frag.appendChild(tr);
  }
  tb.appendChild(frag);
  $("#count").textContent = `· ${rows.length} din ${DATA.length}`;
}

async function toggleRow(tr) {
  const slug = tr.dataset.slug;
  if (tr.classList.contains("open")) {
    tr.classList.remove("open");
    if (tr.nextSibling && tr.nextSibling.classList?.contains("detail")) tr.nextSibling.remove();
    return;
  }
  tr.classList.add("open");
  const det = document.createElement("tr");
  det.className = "detail";
  det.innerHTML = `<td colspan="9"><div class="detbox" style="color:var(--muted)">Se incarca componentele...</div></td>`;
  tr.after(det);

  let d = compCache[slug];
  if (!d) { d = await (await fetch("/api/components?slug=" + slug)).json(); compCache[slug] = d; }

  const setR = DATA.find(x => x.slug === slug);
  const setPrice = setR ? setR.price : null;
  if (setR && d.sum_price != null) {  // actualizeaza si celula "Pe bucati" din rand
    setR.parts_sum = d.sum_price;
    if (tr.children[3]) tr.children[3].innerHTML = partsHtml(setR);
  }
  let html = `<div class="comp"><div class="h">Componenta</div><div class="h" style="text-align:right">Ducati</div><div class="h" style="text-align:right">Pret acum</div>`;
  for (const c of d.components) {
    const qty = c.qty || 1;
    const nm = (qty > 1 ? `<b style="color:var(--accent)">${qty}&times;</b> ` : "") + c.name;
    const duc = c.ducats ? `<div class="num" style="color:var(--gold);font-weight:400">${qty>1?qty+'&times;':''}${c.ducats}</div>` : `<div class="num na">-</div>`;
    const online = c.kind === 'online' ? ' <span style="color:var(--amber);font-size:11px">online</span>' : '';
    const p = c.price != null
      ? `<div class="num">${qty>1?`${qty}&times;${c.price} = `:''}${PLAT} ${qty*c.price}${online}</div>`
      : `<div class="num na">-</div>`;
    html += `<div><a href="https://warframe.market/items/${c.slug}" target="_blank">${nm}</a></div>${duc}${p}`;
  }
  html += `</div>`;
  if (d.sum_price != null && setPrice != null) {
    const diff = setPrice - d.sum_price;
    if (diff > 0) html += `<div class="cmp good">Pe bucati ${PLAT} <b>${d.sum_price}</b> vs set ${setPrice} &rarr; economisesti ${PLAT} <b>${diff}</b></div>`;
    else if (diff < 0) html += `<div class="cmp warn">Setul intreg (${PLAT} ${setPrice}) e mai ieftin cu <b>${-diff}</b> decat pe bucati (${d.sum_price})</div>`;
    else html += `<div class="cmp neutral">Acelasi pret intreg sau pe bucati (${PLAT} ${setPrice})</div>`;
  } else if (d.sum_price != null) {
    html += `<div class="cmp neutral">Suma componente: ${PLAT} <b>${d.sum_price}</b></div>`;
  } else {
    html += `<div class="cmp neutral">Nu toate componentele au seller acum</div>`;
  }
  det.querySelector(".detbox").innerHTML = html;
}

document.addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (chip) {
    if (chip.dataset.v !== undefined) vaultFilter = vaultFilter === chip.dataset.v ? "" : chip.dataset.v;
    else { typeFilter = chip.dataset.t; if (typeFilter === "") vaultFilter = ""; }
    renderChips(); render(); return;
  }
  if (e.target.matches("input[data-s]") || e.target.closest("a")) return;
  const tr = e.target.closest("tr.set");
  if (tr) toggleRow(tr);
});
document.addEventListener("change", e => {
  if (e.target.matches("input[data-s]")) {
    const s = e.target.dataset.s;
    if (e.target.checked) owned[s] = 1; else delete owned[s];
    saveOwned();
    e.target.closest("tr").classList.toggle("owned", !!owned[s]);
    renderChips();
  }
});
document.querySelectorAll("th[data-k]").forEach(th => {
  th.onclick = () => {
    const k = th.dataset.k;
    if (sortK === k) sortDir *= -1; else { sortK = k; sortDir = 1; }
    document.querySelectorAll("th").forEach(x => { x.classList.remove("sorted"); x.removeAttribute("data-dir"); });
    th.classList.add("sorted"); th.dataset.dir = sortDir === 1 ? "▴" : "▾";
    render();
  };
});
$("#q").addEventListener("input", render);
$("#hideOwned").addEventListener("input", () => { renderChips(); render(); });

async function loadData() {
  const j = await (await fetch("/api/data")).json();
  DATA = j.sets;
  renderChips(); render();
}
async function poll() {
  const s = await (await fetch("/api/status")).json();
  const bar = $(".bar"), prog = $("#prog");
  if (s.running) {
    bar.style.display = "block";
    const pct = s.total ? Math.round(s.done/s.total*100) : 0;
    bar.querySelector("i").style.width = pct + "%";
    prog.textContent = `${s.phase || ""} ${s.done}/${s.total}`;
    $("#refresh").disabled = true;
    setTimeout(poll, 1000);
  } else {
    if (bar.style.display === "block") { Object.keys(compCache).forEach(k => delete compCache[k]); await loadData(); }
    bar.style.display = "none";
    prog.textContent = s.error ? "eroare: " + s.error : "";
    $("#refresh").disabled = false;
  }
}
$("#refresh").onclick = async () => { await fetch("/api/refresh", { method: "POST" }); poll(); };

loadData(); poll();
</script>
</body>
</html>
